name: Bug report
description: Something crashes, doesn't work, or looks wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. The session logs help the most: they show what the game was doing and what went wrong, along with the machine, the kernel's page size, ftl-linux's version and its settings. Nothing personal is in them.

        `ftl-linux --paths` shows the log folder (`~/.local/state/ftl-linux` when installed, `data/logs` in a portable folder). The last five sessions are kept, so attach the newest `session-*.txt` soon after the problem.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what happened, and what you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      description: The steps, if you know them, and whether it happens every time.
      placeholder: |
        1. Start a new game with the Kestrel
        2. Open the map and jump to the second beacon
        3. Click the first answer in the event

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The session log(s), as described above. With Hyperspace, zhl.log and FTL_HS.log too.

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or a screen recording
      description: A picture often shows a problem faster than words, above all something drawn wrong or cut off.

  - type: textarea
    id: mods
    attributes:
      label: Mods
      description: The mods applied in ftlman, in its order (top first). Write "none" if you play without mods.
      placeholder: Hyperspace.ftl, Multiverse Assets, Multiverse Data
    validations:
      required: true

  - type: input
    id: system
    attributes:
      label: Machine and distribution
      description: Only needed if you can't attach the logs, which include them.
      placeholder: MacBook Air M1, Fedora Asahi Remix 42, KDE on Wayland

  - type: input
    id: controller
    attributes:
      label: Game controller
      description: If it's about a controller, which one, and is it connected by USB or Bluetooth?
      placeholder: DualSense, Bluetooth
